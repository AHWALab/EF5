name: EF5 Multi-Platform Build

on:
  push:
    branches: [v1.2.6, master]
    tags:
      - "v*"
  pull_request:
    branches: [v1.2.6, master]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    # Ubuntu 26.04 has GDAL 3.12; Zarr output needs GDAL 3.11 or newer
    container: ubuntu:26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            libgeotiff-dev libtiff-dev zlib1g-dev libgdal-dev

      - name: Build
        run: |
          autoreconf --force --install
          ./configure --with-zarr
          make

      - name: Archive Linux build
        run: |
          mkdir -p shared
          cp bin/ef5 shared/ef5 || true
          tar -czf shared/ef5_linux.tar.gz -C shared ef5 || true

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-${{ github.run_id }}
          path: shared/ef5_linux.tar.gz

  build-windows:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cross:
          - mingw64
          - mingw32
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install MinGW and dependencies
        run: |
          sudo apt-get update
          if [ "${{ matrix.cross }}" = "mingw64" ]; then
            sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev zlib1g-dev autoconf automake libtool pkg-config wget
          else
            sudo apt-get install -y gcc-mingw-w64-i686 g++-mingw-w64-i686 binutils-mingw-w64-i686 mingw-w64-i686-dev zlib1g-dev autoconf automake libtool pkg-config wget
          fi

      - name: Build and install dependencies (zlib, libtiff, libgeotiff)
        run: |
          set -e
          if [ "${{ matrix.cross }}" = "mingw64" ]; then
            export CC=x86_64-w64-mingw32-gcc
            export CXX=x86_64-w64-mingw32-g++
            export CXXFLAGS="-I/usr/local/include -I/usr/x86_64-w64-mingw32/sys-root/mingw/include $CXXFLAGS"
            export CFLAGS="-I/usr/local/include -I/usr/x86_64-w64-mingw32/sys-root/mingw/include $CFLAGS"
            export LDFLAGS="-L/usr/x86_64-w64-mingw32/sys-root/mingw/lib $LDFLAGS"
            export PATH=/usr/x86_64-w64-mingw32/sys-root/mingw/lib:$PATH
            # zlib
            wget https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
            tar zxf zlib-1.3.1.tar.gz
            cd zlib-1.3.1
            sed -e s/"PREFIX ="/"PREFIX = x86_64-w64-mingw32-"/ -i win32/Makefile.gcc
            make -f win32/Makefile.gcc
            sudo INCLUDE_PATH=/usr/local/include LIBRARY_PATH=/usr/x86_64-w64-mingw32/sys-root/mingw/lib BINARY_PATH=/usr/x86_64-w64-mingw32/sys-root/mingw/lib/bin make -f win32/Makefile.gcc install
            cd ..
            # libtiff
            wget http://dl.maptools.org/dl/libtiff/tiff-3.8.2.tar.gz
            tar zxf tiff-3.8.2.tar.gz
            cd tiff-3.8.2
            ./configure --host=x86_64-w64-mingw32 --prefix=/usr/x86_64-w64-mingw32/sys-root/mingw --enable-cxx --enable-static \
              --with-zlib-include-dir=/usr/local/include \
              --with-zlib-lib-dir=/usr/x86_64-w64-mingw32/sys-root/mingw/lib --disable-shared
            make
            sudo make install
            cd ..
            # libgeotiff
            wget http://download.osgeo.org/geotiff/libgeotiff/libgeotiff-1.4.2.tar.gz
            tar zxf libgeotiff-1.4.2.tar.gz
            cd libgeotiff-1.4.2
            ./configure --host=x86_64-w64-mingw32 --without-proj --prefix=/usr/x86_64-w64-mingw32/sys-root/mingw --enable-static \
              --with-zip=yes --enable-incode-epsg --disable-static \
              --with-libtiff-include-dir=/usr/x86_64-w64-mingw32/sys-root/mingw/include \
              --with-libtiff-lib-dir=/usr/x86_64-w64-mingw32/sys-root/mingw/lib
            make
            sudo make install
            cd ..
          else
            export CC=i686-w64-mingw32-gcc
            export CXX=i686-w64-mingw32-g++
            export CXXFLAGS="-I/usr/local/include -I/usr/i686-w64-mingw32/sys-root/mingw/include $CXXFLAGS"
            export CFLAGS="-I/usr/local/include -I/usr/i686-w64-mingw32/sys-root/mingw/include $CFLAGS"
            export LDFLAGS="-L/usr/i686-w64-mingw32/sys-root/mingw/lib $LDFLAGS"
            export PATH=/usr/i686-w64-mingw32/sys-root/mingw/lib:$PATH
            # zlib
            wget https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
            tar zxf zlib-1.3.1.tar.gz
            cd zlib-1.3.1
            sed -e s/"PREFIX ="/"PREFIX = i686-w64-mingw32-"/ -i win32/Makefile.gcc
            make -f win32/Makefile.gcc
            sudo INCLUDE_PATH=/usr/local/include LIBRARY_PATH=/usr/i686-w64-mingw32/sys-root/mingw/lib BINARY_PATH=/usr/i686-w64-mingw32/sys-root/mingw/lib/bin make -f win32/Makefile.gcc install
            cd ..
            # libtiff
            wget http://dl.maptools.org/dl/libtiff/tiff-3.8.2.tar.gz
            tar zxf tiff-3.8.2.tar.gz
            cd tiff-3.8.2
            ./configure --host=i686-w64-mingw32 --prefix=/usr/i686-w64-mingw32/sys-root/mingw --enable-cxx --enable-static \
              --with-zlib-include-dir=/usr/local/include \
              --with-zlib-lib-dir=/usr/i686-w64-mingw32/sys-root/mingw/lib --disable-shared
            make
            sudo make install
            cd ..
            # libgeotiff
            wget http://download.osgeo.org/geotiff/libgeotiff/libgeotiff-1.4.2.tar.gz
            tar zxf libgeotiff-1.4.2.tar.gz
            cd libgeotiff-1.4.2
            ./configure --host=i686-w64-mingw32 --without-proj --prefix=/usr/i686-w64-mingw32/sys-root/mingw --enable-static \
              --with-zip=yes --enable-incode-epsg --disable-static \
              --with-libtiff-include-dir=/usr/i686-w64-mingw32/sys-root/mingw/include \
              --with-libtiff-lib-dir=/usr/i686-w64-mingw32/sys-root/mingw/lib
            make
            sudo make install
            cd ..
          fi
          set +e

      - name: Build for Windows
        run: |
          set -e
          if [ "${{ matrix.cross }}" = "mingw64" ]; then
            export CC=x86_64-w64-mingw32-gcc
            export CXX=x86_64-w64-mingw32-g++
            export CFLAGS="-I/usr/local/include -I/usr/x86_64-w64-mingw32/sys-root/mingw/include $CFLAGS"
            export CXXFLAGS="-I/usr/local/include -I/usr/x86_64-w64-mingw32/sys-root/mingw/include $CXXFLAGS"
            export LDFLAGS="-L/usr/x86_64-w64-mingw32/sys-root/mingw/lib $LDFLAGS"
            autoreconf --force --install
            ./configure --host=x86_64-w64-mingw32
            make
            mkdir -p shared
            cp bin/ef5.exe shared/ef5_64.exe
            cd shared
            zip ef5_win64.zip ef5_64.exe
          else
            export CC=i686-w64-mingw32-gcc
            export CXX=i686-w64-mingw32-g++
            export CFLAGS="-I/usr/local/include -I/usr/i686-w64-mingw32/sys-root/mingw/include $CFLAGS"
            export CXXFLAGS="-I/usr/local/include -I/usr/i686-w64-mingw32/sys-root/mingw/include $CXXFLAGS"
            export LDFLAGS="-L/usr/i686-w64-mingw32/sys-root/mingw/lib $LDFLAGS"
            autoreconf --force --install
            ./configure --host=i686-w64-mingw32
            make
            mkdir -p shared
            cp bin/ef5.exe shared/ef5_32.exe
            cd shared
            zip ef5_win32.zip ef5_32.exe
          fi

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cross }}-build-${{ github.run_id }}
          path: shared/ef5_win${{ matrix.cross == 'mingw64' && '64' || '32' }}.zip

  # Docker image for version tags: ghcr.io/<owner>/ef5:<version> and :latest.
  # Apptainer users can pull it too (apptainer pull docker://...).
  docker-image:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ef5
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code (for the release notes)
        uses: actions/checkout@v4

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            awk -v v="$version" '
              index($0, "## EF5 Version [" v "]") == 1 { on = 1; next }
              on && /^## EF5 Version \[/ { exit }
              on && /^---$/ { next }
              on { print }' CHANGELOG.md
            echo
            echo "## Getting EF5 $version"
            echo
            echo "- Linux (built on Ubuntu 26.04, needs its libraries) and Windows binaries: below."
            echo "- Docker image: \`docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ef5:$version\`"
            echo "- Apptainer (HPC): \`apptainer pull ef5.sif docker://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ef5:$version\`"
            echo "- From source: see README.md (Compiling) and docker/README.md."
          } > release_notes.md
          cat release_notes.md

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: build-linux-${{ github.run_id }}
          path: ./artifacts

      - name: Download Windows mingw64 artifact
        uses: actions/download-artifact@v4
        with:
          name: mingw64-build-${{ github.run_id }}
          path: ./artifacts

      - name: Download Windows mingw32 artifact
        uses: actions/download-artifact@v4
        with:
          name: mingw32-build-${{ github.run_id }}
          path: ./artifacts

      - name: Create release for tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create ${{ github.ref_name }} --repo ${{ github.repository }} --title "EF5 Version ${{ github.ref_name }}" --notes-file release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update latest release for master
        if: github.ref == 'refs/heads/master'
        run: |
          if gh release view latest --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "Latest release exists, updating..."
          else
            gh release create latest --repo ${{ github.repository }} --title "Latest Build" --notes "Latest build from master branch" --prerelease
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug artifacts directory
        run: |
          echo "Contents of ./artifacts:"
          ls -la ./artifacts/
          echo "Contents of ./artifacts/shared (if exists):"
          ls -la ./artifacts/shared/ || echo "shared directory does not exist"
          echo "Checking if files exist:"
          test -f ./artifacts/ef5_linux.tar.gz && echo "Linux file exists" || echo "Linux file missing"
          test -f ./artifacts/ef5_win64.zip && echo "Windows 64 file exists" || echo "Windows 64 file missing"
          test -f ./artifacts/ef5_win32.zip && echo "Windows 32 file exists" || echo "Windows 32 file missing"

      - name: Upload Linux artifact to tag release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release upload ${{ github.ref_name }} --repo ${{ github.repository }} ./artifacts/ef5_linux.tar.gz --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows mingw64 artifact to tag release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release upload ${{ github.ref_name }} --repo ${{ github.repository }} ./artifacts/ef5_win64.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows mingw32 artifact to tag release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release upload ${{ github.ref_name }} --repo ${{ github.repository }} ./artifacts/ef5_win32.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifact to latest release
        if: github.ref == 'refs/heads/master'
        run: |
          gh release upload latest --repo ${{ github.repository }} ./artifacts/ef5_linux.tar.gz --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows mingw64 artifact to latest release
        if: github.ref == 'refs/heads/master'
        run: |
          gh release upload latest --repo ${{ github.repository }} ./artifacts/ef5_win64.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows mingw32 artifact to latest release
        if: github.ref == 'refs/heads/master'
        run: |
          gh release upload latest --repo ${{ github.repository }} ./artifacts/ef5_win32.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
